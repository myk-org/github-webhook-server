skipsdist = true

envlist = ["unused-code", "unittests"]

[env.unused-code]
deps = ["python-utility-scripts"]
commands = [
  [
    "pyutils-unusedcode",
    "--exclude-function-prefixes",
    "'process_webhook','validate_config_file', 'get_log_viewer_page'",
    # Vendored third-party JS tooling under sidecar-helper/node_modules (gitignored,
    # regenerated by npm install). Its entry points are legitimately unused here.
    # NOTE: --exclude-files matches BASENAME only (os.path.basename), not a path, so
    # this must stay "httpd.py" - a directory or path pattern is silently ignored.
    "--exclude-files",
    "httpd.py",
  ],
]

[env.unittests]
deps = ["uv"]
commands = [
  [
    "uv",
    "run",
    "--extra",
    "tests",
    "pytest",
    "-n",
    "auto",
    "webhook_server/tests",
    "scripts",
  ],
]
