name: Docs Guard

# Regeneration stays off the PR: main tracks docs sources only, and .github/workflows/docs.yml
# builds and deploys the site after merge (#1280). Anything under docs/ that is not markdown or
# nav.json is build output, and committing it re-creates the merge conflicts this rule exists to
# remove.

on: pull_request

permissions:
  contents: read

jobs:
  no-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject generated docs in the PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A broken or unset BASE_REF must fail the job, not pass it: without this the diff command
          # would exit non-zero, the file would be empty, and an empty diff reads exactly like a
          # clean one.
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::BASE_REF is empty — the diff base cannot be resolved."
            exit 1
          fi
          # The diff is captured to a file first so its exit status is checked on its own: piping
          # git into grep without pipefail reports "no match" when the diff never ran (missing base
          # ref, shallow clone), so an absent check would look exactly like a passing one.
          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT

          # -z keeps git from quoting or escaping paths (that is core.quotePath and unrelated to
          # the shell): quoted, an added docs/résumé.html arrives as
          # "docs/r\303\251sum\303\251.html" and matches none of the patterns below — the guard
          # would pass exactly the files it exists to reject.
          git diff --name-status -z --diff-filter=AMR -M "origin/${BASE_REF}...HEAD" > "$diff_file"

          # Only added/modified/renamed files are a violation. A DELETION is the migration itself
          # (the cutover removes the committed output) and must pass, or the PR that fixes the rule
          # can never satisfy it. Renames are checked on BOTH sides, so
          # docs/foo.md -> docs/index.html is caught too.
          # -z emits `status\0path\0` (`R100\0old\0new\0` for a rename), so the status tokens are
          # dropped by shape, not by column — there is no column left after NUL splitting.
          # The fields are matched as they arrive and never re-joined with newlines: a path CAN
          # itself contain a newline, and converting NUL -> newline splits `docs/evil\nx.html`
          # into two lines that match none of the patterns — the generated file would slip
          # through. `read -d ''` fails at EOF, which only ends this while condition (set -e does
          # not apply to a loop condition), so the last field is not dropped.
          offenders=()
          while IFS= read -r -d '' field; do
            # Status tokens: no path under docs/ can look like one, they all start with `docs/`.
            [[ "$field" =~ ^[ACDMRTUXB][0-9]*$ ]] && continue
            [[ "$field" == docs/* ]] || continue
            [[ "$field" == docs/nav.json ]] && continue
            [[ "$field" =~ ^docs/(.*/)?[^/]+\.md$ ]] && continue
            offenders+=("$field")
          done < "$diff_file"

          if [ "${#offenders[@]}" -gt 0 ]; then
            echo "::error::Generated docs must not be committed — the site is built on main from the docs sources."
            printf '%s\n' "${offenders[@]}"
            echo "Everything under docs/ other than docs/**/*.md and docs/nav.json is build output of"
            echo ".github/workflows/docs.yml — edit the markdown source instead."
            exit 1
          fi
          echo "No generated docs in the diff."
