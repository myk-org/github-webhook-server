name: Docs

# Builds the docs site from docs/*.md and publishes it to GitHub Pages. The generated output
# (docs/*.html, docs/assets/**, .nojekyll, llms*.txt, search-index.json) is never committed:
# it is global — computed from every page — so committing it made any two docs PRs conflict in
# the generated bytes instead of in the source they changed (#1280).

on:
  push:
    branches: [main]
    paths:
      # Any docs change, not just .md: the migration that removes the committed output touches
      # only generated paths, and it must still deploy.
      - "docs/**"
      # The renderer pin lives in this file, so a pin bump touches neither `docs/**` nor a source
      # page — without this entry that merge would deploy nothing and Pages would keep serving
      # output from the previous renderer until some later docs change.
      - ".github/workflows/docs.yml"
  # Manual re-run only — it is not how the first deploy happens: the merge that removes the
  # committed output deletes docs/**, which matches the paths filter above, so that push deploys.
  # This trigger exists for re-deploying after a failed run.
  workflow_dispatch:

concurrency:
  # Scoped by ref, not a single `docs` group: `concurrency` is evaluated before the job-level
  # main-only conditions, so a shared group let a `workflow_dispatch` on a branch cancel a live
  # main deployment — and then skip both jobs, leaving the merged docs unpublished until the next
  # run. A branch dispatch now only ever cancels itself.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # workflow_dispatch accepts any ref, so without this guard `gh workflow run docs.yml --ref
    # some-branch` would publish that branch's docs/ to the live Pages site. Deploying is main-only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Building needs nothing but the sources: publish rights live on the deploy job alone, so
    # whatever the build step runs can never reach Pages.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site from docs/*.md
        # Pinned, not `@latest`: this step's output is what `deploy` publishes, so the renderer is a
        # build tool — an unpinned release lets a new (or compromised) upstream version replace the
        # live site with no commit here to review, and it makes "a rebuild reproduces the site"
        # untestable across versions. Bump the pin deliberately.
        run: >-
          uvx pi-docsite==4.18.0 --docs-dir docs
          --tagline "Keep GitHub pull requests moving with automated checks, approvals, labels, cherry-picks, and release workflows."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The only job that publishes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
